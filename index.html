async function readAllNt(){await sb.from('notificacoes').update({lida_em:new Date().toISOString()}).is('lida_em',null);await loadNotifs()}
async function openNt(id){const x=(S.nt||[]).find(y=>y.id===id);if(!x)return;if(!x.lida_em){await sb.from('notificacoes').update({lida_em:new Date().toISOString()}).eq('id',id);x.lida_em=new Date().toISOString()}S.np=false;renderBell();
if(S.u==='val'){const d=(S.vd||[]).find(y=>y.id===x.documento_id);if(d&&d.status==='em_validacao'&&!d.me.decisao)openVal(d.id)}}
function realtime(){if(S.demo||rt)return;const f=()=>{clearTimeout(rtT);rtT=setTimeout(bump,800)};rt=sb.channel('aval').on('postgres_changes',{event:'*',schema:'public',table:'documentos'},f).on('postgres_changes',{event:'*',schema:'public',table:'participantes'},f).on('postgres_changes',{event:'*',schema:'public',table:'notificacoes'},()=>loadNotifs()).subscribe()}
async function bump(){if(!S.u||S.demo)return;if(S.u==='val'){await loadVal();if(S.v==='vlist')render()}else{await load();if(['docs','users','recv','aud'].includes(S.v))render(true);else if(S.v==='doc'&&S.doc)openDoc(S.doc.id)}}
async function logout(){if(rt){try{await sb.removeChannel(rt)}catch(_){}rt=null}if(S.demo)return location.reload();await unlinkPush();S.push=undefined;await sb.auth.signOut();S.u=null;S.me=null;S.step='login';render();S.nt=[];S.ntInit=0;S.np=false;renderBell()}
function render(keep){const r=$('#root');let x;
if(!S.u)x=loginV();
else if(S.u==='val'&&!S.demo){x=S.v==='vdoc'?vdocV():vlistR()}
else if(S.u==='val'){x=S.v==='pdf'?pdfV():S.v==='vid'?vidV():`${vtop('Meus documentos').replace(/<div class="cols[\s\S]*$/,'')}</div>`.replace(/<div class="main"[\s\S]*$/,'')+vlist()}
else{const m={doc:docV,docs:docsV,users:usersV,rules:rulesV,newuser:newUserV,cred:credV,new:newV,edit:editV,recv:recvV,aud:audV,cfg:cfgV};x=`<div class="app">${nav()}<main class="main">${demo()}${(m[S.v]||docsV)()}</main></div>`}
const f=keep&&document.activeElement.id==='q';r.innerHTML=x+(S.toast?`<div class="toast">${S.toast}</div>`:'');const k=S.u+'|'+S.v+'|'+S.step;if(S._k!==k){S._k=k;r.classList.add('go');clearTimeout(S._gt);S._gt=setTimeout(()=>r.classList.remove('go'),1200);countUp()}if(f){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
setInterval(async()=>{if(S.u&&!S.demo&&!document.hidden&&['docs','users','aud'].includes(S.v)){await load();render(true)}},20000);
setInterval(()=>{if(S.u&&!S.demo&&!document.hidden)loadNotifs()},30000);
// ===== AVISOS PUSH (celular e desktop) =====
function b64u(s){const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
async function pushSub(){try{const reg=await navigator.serviceWorker.getRegistration();return reg?await reg.pushManager.getSubscription():null}catch(_){return null}}
async function linkPush(sub){const j=sub.toJSON();const{error}=await sb.rpc('registrar_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_agente:navigator.userAgent.slice(0,200)});if(error)throw error}
async function unlinkPush(){try{const sub=await pushSub();if(sub)await sb.rpc('remover_push',{p_endpoint:sub.endpoint})}catch(_){}}
async function checkPush(){
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){S.push=ios&&!standalone?'ios':'nao';return renderBell()}
if(Notification.permission==='denied'){S.push='negado';return renderBell()}
S.push='off';
if(Notification.permission==='granted'){const sub=await pushSub();if(sub){try{await linkPush(sub);S.push='on'}catch(_){}}}
renderBell()}
async function ativarPush(){try{
const perm=await Notification.requestPermission();
if(perm!=='granted'){S.push=perm==='denied'?'negado':'off';return renderBell()}
const reg=await navigator.serviceWorker.ready;
let sub=await reg.pushManager.getSubscription();
if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
await linkPush(sub);S.push='on';toast('Avisos ativados neste aparelho')
}catch(e){toast('Não foi possível ativar os avisos: '+(e.message||e))}
renderBell()}
async function desativarPush(){try{const sub=await pushSub();if(sub){await sb.rpc('remover_push',{p_endpoint:sub.endpoint});await sub.unsubscribe()}S.push='off';toast('Avisos desativados neste aparelho')}catch(e){toast('Erro ao desativar: '+(e.message||e))}renderBell()}
function pushUi(){const p='padding:4px 6px;margin:0',a='cursor:pointer;text-decoration:underline',st=S.push;
if(st==='ios')return `<p style="${p}">📱 No iPhone: toque em <b>Compartilhar</b> › <b>Adicionar à Tela de Início</b>, abra o Aval pelo ícone criado e ative os avisos aqui.</p>`;
if(st==='nao')return `<p style="${p};opacity:.7">Este navegador não aceita avisos push.</p>`;
if(st==='negado')return `<p style="${p}">Avisos bloqueados. Libere as notificações deste site nas configurações do navegador/aparelho.</p>`;
if(st==='on')return `<p style="${p}">✅ Avisos ativos neste aparelho · <a style="${a}" onclick="desativarPush()">desativar</a></p>`;
return `<p style="${p}"><a style="${a}" onclick="ativarPush()">🔔 Ativar avisos neste aparelho</a></p>`}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
// ===== ADMINISTRAÇÃO: usuários e regras =====

async function arquivar(id,v){const d=docs.find(x=>x.id===id);if(!d)return;
if(S.demo){d.arq=v;return render(true)}
try{const{error}=await sb.rpc('arquivar_pedido',{p_doc:d.uid,p_arquivar:v});if(error)throw error;d.arq=v;render(true);toast(v?d.id+' arquivado':d.id+' voltou para a lista')}catch(e){toast('Erro: '+(e.message||e))}}
function audV(){const q=S.q.toLowerCase(),L=docs.filter(d=>d.s!=='val'&&(d.t+' '+d.id+' '+d.o).toLowerCase().includes(q)).sort((a,b)=>new Date(b.cd||0)-new Date(a.cd||0));
const R={ok:['wh','Aprovado'],rep:['rd','Reprovado'],exp:['rd','Expirado']};
const rows=L.map(d=>{const r=R[d.s]||['gr','—'],n=d.nf||(d.p?1:0);
return `<tr><td><b>${esc(d.t)}</b><small>${esc(d.id)} · ${esc(d.o)}${d.arq?' · arquivado':''}</small><td>${d.cd?fd(d.cd):'—'}<td><span class=\"tag ${r[0]}\">${r[1]}</span><td>${n?n+' arquivo(s)':'<span class=\"mu\">apagados</span>'}<td><button class=\"sm r\" onclick=\"openDoc('${esc(d.id)}')\">Arquivos e histórico</button>${d.ap?` <button class=\"sm\" onclick=\"openAud('${esc(d.id)}')\">PDF de auditoria</button>`:d.ape?' <span class=\"mu\">PDF apagado</span>':' <span class=\"mu\">PDF em preparo</span>'}</tr>`}).join('')||'<tr><td colspan=5 class=\"mu\">Nenhum pedido concluído ainda.</tr>';
return head('Auditoria','Pedidos concluídos: arquivos, quem validou e histórico')+`<div class=\"tabs\"><input placeholder=\"Buscar documento\" value=\"${esc(S.q)}\" oninput=\"S.q=this.value;render(true)\" id=\"q\"></div><div class=\"tw\"><table><tr><th>Documento<th>Concluído<th>Resultado<th>Arquivos<th></tr>${rows}</table></div><p class=\"foot\">Mostra todos os administradores, inclusive pedidos arquivados. Arquivos, PDF e histórico são apagados 30 dias após a conclusão.</p>`}
function cfgV(){const ps=S.push,me=U[S.u]||{},ativos=users.filter(u=>!/\(inativo\)/.test(u[0])),n=l=>ativos.filter(u=>u[1]===l).length;
const a='cursor:pointer;text-decoration:underline';
const pushTxt=ps==='on'?`✅ Ativos neste aparelho · <a style=\"${a}\" onclick=\"desativarPush().then(()=>render())\">desativar</a>`:ps==='negado'?'Bloqueados. Libere as notificações deste site nas configurações do navegador.':ps==='ios'?'No iPhone: toque em Compartilhar › Adicionar à Tela de Início, abra o Aval pelo ícone e ative aqui.':ps==='nao'?'Este navegador não aceita avisos push.':`<a style=\"${a}\" onclick=\"ativarPush().then(()=>render())\">🔔 Ativar avisos neste aparelho</a>`;
const li=(t,v)=>`<p style=\"display:flex;justify-content:space-between;gap:16px;margin:0 0 10px;border-bottom:1px solid var(--bd);padding-bottom:8px\"><span class=\"mu\">${t}</span><b>${v}</b></p>`;
return head('Configurações','Sua conta, avisos e regras automáticas do sistema')+`<div class=\"cols\"><div><div class=\"pn\"><h2><em>1</em>Minha conta</h2>${li('Nome',esc(me.n||'—'))}${li('Perfil',esc(me.r||'—'))}</div>
<div class=\"pn\"><h2><em>2</em>Avisos no aparelho</h2><p style=\"margin:0\">${pushTxt}</p><p class=\"foot\">Receba no celular ou computador os pedidos novos, prazos reabertos e lembretes.</p></div>
<div class=\"pn\"><h2><em>3</em>Usuários ativos</h2>${li('Administradores',n('ADMINISTRADOR'))}${li('Validadores',n('VALIDADOR'))}${li('Masters',n('MASTER'))}<p class=\"foot\"><a style=\"${a}\" onclick=\"go('users')\">Gerenciar usuários</a></p></div></div>
<div><div class=\"how\"><h2>Regras automáticas</h2>${li('Prazo reaberto pelo Master','+24 h')}${li('Lembretes aos validadores','24 h e 2 h antes do prazo')}${li('Arquivos originais apagados','30 dias após a conclusão')}${li('PDF de auditoria apagado','30 dias após a conclusão')}${li('Registro e histórico apagados','30 dias após a conclusão')}${li('PDF de auditoria gerado','automático, em poucos minutos')}<p class=\"foot\">Estes valores são fixos no sistema. Para mudar a retenção, altere as constantes ARQUIVO_DIAS, PDF_DIAS e HISTORICO_DIAS na função aval-auditoria.</p></div></div></div>`}
async function adm(body){const{data,error}=await sb.functions.invoke('aval-admin',{body});if(error||(data&&data.erro))throw new Error(error?await fnErr(error,data):data.erro);return data}
function newUserV(){return `<div class="crumb"><a style="cursor:pointer" onclick="go('users')">Usuários</a> / Novo usuário</div>`+head('Novo usuário','O sistema gera uma senha provisória')+`<div class="cols"><div class="pn"><h2><em>1</em>Dados</h2><label class="l">Nome completo</label><input id="un" autocomplete="off"><label class="l">Usuário (para entrar)</label><input id="uu" autocomplete="off" autocapitalize="none" placeholder="ex.: maria.silva"><small class="mu">3 a 30 caracteres: letras minúsculas, números, ponto, hífen ou _.</small><label class="l">Perfil</label><select id="up"><option value="validador">Validador</option><option value="master">Master</option><option value="administrador">Administrador</option></select><p class="mu" id="ue" style="color:#ff8a8a"></p><div class="acts"><button class="btn g" onclick="go('users')">Cancelar</button><button class="btn" id="ub" onclick="criarUsuario()">Criar usuário</button></div></div><div class="how"><h2>Como funciona</h2><p>O sistema cria o acesso e mostra o usuário e uma senha provisória, uma única vez.</p><p>No primeiro acesso a pessoa é obrigada a trocar a senha. Validadores e Masters também criam a senha de validação.</p></div></div>`}
async function criarUsuario(){const nome=$('#un').value.trim(),usuario=$('#uu').value.trim().toLowerCase(),papel=$('#up').value,e=$('#ue'),b=$('#ub');e.textContent='';
if(nome.length<2)return e.textContent='Informe o nome.';
if(!/^[a-z0-9._-]{3,30}$/.test(usuario))return e.textContent='Usuário inválido: use 3 a 30 letras minúsculas, números, ponto, hífen ou _.';
b.disabled=true;b.textContent='Criando…';
try{const r=await adm({acao:'criar',nome,usuario,papel});S.cred={t:'Usuário criado',nome,usuario:r.usuario,senha:r.senha_provisoria};S.v='cred';await load();render()}
catch(x){b.disabled=false;b.textContent='Criar usuário';e.textContent=x.message||String(x)}}
function credV(){const c=S.cred||{};return `<div class="crumb">Usuários / ${esc(c.t||'')}</div>`+head(esc(c.t||'Acesso'),esc(c.nome||''))+`<div class="pn" style="max-width:520px"><label class="l" style="margin-top:0">Usuário</label><div style="font:700 22px monospace;word-break:break-all">${esc(c.usuario)}</div><label class="l">Senha provisória</label><div style="font:700 22px monospace;word-break:break-all;color:var(--yl)">${esc(c.senha)}</div><p class="lock">Anote ou copie agora: esta senha não aparece de novo. No primeiro acesso a pessoa define uma senha nova.</p><div class="acts" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="copiarAcesso()">Copiar mensagem</button><button class="btn g" onclick="go('users')">Voltar aos usuários</button></div></div>`}
function copiarAcesso(){const c=S.cred||{},t='Acesso ao Aval\nEndereço: '+location.origin+location.pathname+'\nUsuário: '+c.usuario+'\nSenha provisória: '+c.senha+'\nNo primeiro acesso você vai criar uma senha nova.';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Mensagem copiada'),()=>{prompt('Copie a mensagem:',t)})}
async function resetUser(id,nome){if(!confirm('Gerar nova senha provisória para '+nome+'? A senha atual deixa de valer e a pessoa cria uma nova no próximo acesso (validadores e Masters também criam a senha de validação de novo).'))return;
try{const r=await adm({acao:'redefinir',id});S.cred={t:'Senha redefinida',nome,usuario:r.usuario,senha:r.senha_provisoria};S.v='cred';render()}catch(e){toast('Erro: '+(e.message||e))}}
async function setAtivo(id,nome,ativo){if(!confirm((ativo?'Reativar ':'Desativar ')+nome+'?'+(ativo?'':' A pessoa deixa de conseguir entrar e de receber avisos.')))return;
try{await adm({acao:'ativo',id,ativo});await load();render(true);toast(nome+(ativo?' reativado':' desativado'))}catch(e){toast('Erro: '+(e.message||e))}}
async function openRules(id){const u=users.find(x=>x[5]===id);try{
const{data,error}=await sb.rpc('obter_regras',{p_admin:id});if(error)throw error;
const{data:ps,error:e2}=await sb.from('perfis').select('id,nome,papel').eq('ativo',true).order('nome');if(e2)throw e2;
S.ru={id,nome:u?u[7]:'Administrador'};S.pa=(ps||[]).filter(p=>['administrador','admin_master'].includes(p.papel)&&p.id!==id);S.pv=(ps||[]).filter(p=>p.papel==='validador');
S.rules={dest:data.pode_entregar?'out':'none',master:{obrigatoria:'req',opcional:'opt',dispensada:'off'}[data.validacao_master]||'opt',vals:data.validadores_restritos?'sel':'all',prazo:data.prazo_vencido==='master'?'master':'expirar',destinos:data.destinos||[],valids:data.validadores||[]};
S.v='rules';render()}catch(e){toast('Erro ao abrir as regras: '+(e.message||e))}}
function tgl(k,id,on){const a=S.rules[k];S.rules[k]=on?[...new Set([...a,id])]:a.filter(x=>x!==id);render(true)}
async function salvarRegras(){const r=S.rules,b=$('#sr');if(b)b.disabled=true;
try{const{error}=await sb.rpc('salvar_regras',{p_admin:S.ru.id,p_pode_entregar:r.dest==='out',p_validacao_master:{req:'obrigatoria',opt:'opcional',off:'dispensada'}[r.master],p_validadores_restritos:r.vals==='sel',p_destinos:r.dest==='out'?r.destinos:[],p_validadores:r.vals==='sel'?r.valids:[],p_prazo_vencido:r.prazo==='master'?'master':'expirar'});if(error)throw error;S.v='users';render();toast('Regras salvas. Valem para os próximos pedidos.')}
catch(e){if(b)b.disabled=false;toast('Erro ao salvar: '+(e.message||e))}}
let vtm;function voltou(){clearTimeout(vtm);vtm=setTimeout(()=>{if(document.hidden||!S.u||S.demo)return;bump();loadNotifs()},300)}
document.addEventListener('visibilitychange',voltou);window.addEventListener('focus',voltou);window.addEventListener('pageshow',voltou);
sb.auth.getSession().then(({data})=>data.session?enter():render());
</script></body></html>
